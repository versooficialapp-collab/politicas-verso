<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacidade - Verso</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; color: #333; background: #f9f9f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Política de Privacidade</h1>
        <p>O aplicativo <strong>Verso</strong> valoriza sua privacidade. Suas notas são armazenadas localmente no seu dispositivo utilizando SharedPreferences.</p>
        <p>Nenhum dado é coletado ou enviado para servidores externos. Ao desinstalar o app, seus dados são apagados pelo sistema Android.</p>
    </div>
</body>
</html>
